name: Notify Management on Push

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Get commit info
        id: commit
        run: |
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "hash=$(git log -1 --pretty=format:'%h')" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=format:'%ci')" >> $GITHUB_OUTPUT
          echo "body=$(git log -1 --pretty=format:'%b')" >> $GITHUB_OUTPUT
          
          # Get changed files
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only HEAD~1 HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Alya Bıçak Web] Kod Güncellemesi: ${{ steps.commit.outputs.message }}"
          to: yagiz@alyatekstil.com,pelin@alyatekstil.com
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
                .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                .header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 20px; border-radius: 8px 8px 0 0; }
                .content { background: #f9fafb; padding: 20px; border: 1px solid #e5e7eb; }
                .section { background: white; padding: 15px; margin: 15px 0; border-radius: 6px; border-left: 4px solid #3b82f6; }
                .section h3 { margin-top: 0; color: #1e3a8a; }
                .technical { background: #f3f4f6; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; }
                .files { background: #fef3c7; padding: 10px; border-radius: 4px; margin: 10px 0; }
                .footer { text-align: center; padding: 20px; color: #6b7280; font-size: 12px; }
                .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
                .badge-success { background: #dcfce7; color: #166534; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h2 style="margin: 0;">🚀 Alya Bıçak Web Sitesi Güncellendi</h2>
                  <p style="margin: 5px 0 0 0; opacity: 0.9;">Otomatik Bildirim Sistemi</p>
                </div>
                
                <div class="content">
                  <div class="section">
                    <h3>📝 Yapılan Değişiklik</h3>
                    <p><strong>${{ steps.commit.outputs.message }}</strong></p>
                    ${{ steps.commit.outputs.body && format('<p>{0}</p>', steps.commit.outputs.body) }}
                  </div>
                  
                  <div class="section">
                    <h3>📂 Değiştirilen Dosyalar</h3>
                    <div class="files">
                      <pre style="margin: 0; white-space: pre-wrap; word-wrap: break-word;">${{ steps.commit.outputs.files }}</pre>
                    </div>
                  </div>
                  
                  <div class="section">
                    <h3>ℹ️ Teknik Bilgiler</h3>
                    <div class="technical">
                      <strong>Commit ID:</strong> ${{ steps.commit.outputs.hash }}<br>
                      <strong>Tarih:</strong> ${{ steps.commit.outputs.date }}<br>
                      <strong>Geliştirici:</strong> ${{ steps.commit.outputs.author }}<br>
                      <strong>Branch:</strong> ${{ github.ref_name }}<br>
                      <strong>Repository:</strong> ${{ github.repository }}
                    </div>
                  </div>
                  
                  <div class="section">
                    <h3>🔗 Bağlantılar</h3>
                    <p>
                      <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}" style="color: #3b82f6; text-decoration: none;">
                        → Commit Detaylarını Görüntüle
                      </a>
                    </p>
                    <p>
                      <a href="https://alyabicak.com" style="color: #3b82f6; text-decoration: none;">
                        → Web Sitesini Ziyaret Et
                      </a>
                    </p>
                  </div>
                </div>
                
                <div class="footer">
                  <p>Bu mail GitHub Actions tarafından otomatik olarak gönderilmiştir.</p>
                  <p style="color: #9ca3af;">Alya Tekstil Sanayi Ticaret Ltd. Şti. © ${{ steps.commit.outputs.date }}</p>
                </div>
              </div>
            </body>
            </html>
